<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My fitness card</title>

 <Style>
    body {
            background-color: rgb(170, 93, 189);
            font-family: Arial, Helvetica, sans-serif;
        
        }

        .Fitness-routine {
            background-color: rgb(197, 197, 170);
            color: darkslategray;
            width: 260px;
            padding: 25px;
            border: 4px solid rgb(68, 134, 132);
            margin: 30px;
        }
        .Workout-name {
            color: rgb(126, 72, 193);
            font-size: 22px;
        }
        .detail1 {
         background-color: cadetblue;
            color: rgb(238, 237, 244);
        }
        .detail2 {
            background-color: black;
            color: rgb(121, 55, 133);
        }
        .detail3 {
            background-color: darkkhaki;
            color: rgb(136, 65, 202);
        }
        .cool-fact {
            color: rgb(74, 102, 154);
            font-style: italic;
        }
 </Style>

</head>
<body>
    
<div class="Fitness-routine">
    <h2 class="Workout-name">Low Intensity</h2>
    <p class="detail1">Age range: 10+</p>
    <p class="detail2">Length: 40 minutes</p>
<p class="detail3">Recommended-time: Morning</p>
<p class="cool-fact">Cool Fact: Help you loose 10kg</p>
</div>

</body>
</html>
