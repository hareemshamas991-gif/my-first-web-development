<html lang="en">
<head>
    <title>My playlist sorter</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    body { background: lavender; }
    h1, h3 { color: darkviolet; }
    .box { background: white; color: darkviolet; }

<body>
    
    <div class="container ny-4">

        <h1 class="mb-1">My playlist sorter</h1>
        <p class="text-muted mb-4">Sort and label your
            music playlist using JavaScript array methods!
        </p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card title">Song names</h3>
                <button class="btn btn-primary mr-2"
                onclick="sortAZ()">Sort A to Z</button>
                <div id="nameResult" class="box p-3 mt-3 rounded"></div>
                <button class="btn btn-primary" on click="sortZA()">SORT Z TO A</button>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card title">Play Counts</h3>
                <button class="btn btn-primary mr-2"
                onclick="sortLeast()">Least played first</button>
                <button class="btn btn-primary" on click="sortMost()">Most played first</button>
            <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card title">Label every play count</h3>
                <button class="btn btn-primary mr-2"
                onclick="addLabel()">Add plays label</button>
            <div id="labelResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

            var plays = [320, 85, 210, 50, 175];

            document.getElementById("nameResult").innerHTML = "Songs: " + songs;
            document.getElementById("countResult").innerHTML = "Plays: " + plays;
            document.getElementById("nameResult").innerHTML = "Press the button above! ";

                document.getElementById("nameResult").innerHTML = "Z to A: " + songs; }

            function sortLeast() { plays.sort(function(a,b){return a-b});

</body>
</html>
