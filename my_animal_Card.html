<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        body {
            background-color: darkgreen;
            font-family: Arial, Helvetica, sans-serif;
        
        }

        .fact-file {
            background-color: lightyellow;
            color: darkslategray;
            width: 260px;
            padding: 25px;
            border: 4px solid rgb(132, 248, 244);
            margin: 30px;
        }
        .animal-name {
            color: forestgreen;
            font-size: 22px;
        }
        .detail {
            color: darkslategray;
        }
        .cool-fact {
            color: darkorange;
            font-style: italic;
        }


    </Style>
</head>
<body>
    
<div class="fact-file">
    <h2 class="animal-name">Snow Leopard</h2>
    <p class="detail">Type: Big Cat</p>
    <p class="detail">Lives in: Mountain ranged of central Asia</p>
<p class="detail">Diet: Deer, goats, and wild sheep</p>
<p class="cool-fact">Cool Fact: Can leap up to 15 metres in one jump</p>
</div>


</body>
</html>
